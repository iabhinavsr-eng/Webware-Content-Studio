<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan Mode - SEO Content Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f8fafc; color: #1e293b; line-height: 1.6; }
        
        .app-header { 
            background: white; 
            border-bottom: 1px solid #e2e8f0; 
            padding: 1rem 2rem; 
            display: flex; 
            align-items: center; 
            gap: 2rem;
        }
        .app-header h1 { font-size: 1.25rem; font-weight: 600; }
        .nav-tabs { display: flex; gap: 0.5rem; }
        .nav-tab { 
            padding: 0.5rem 1rem; 
            background: #f1f5f9; 
            border: 1px solid #e2e8f0; 
            border-radius: 0.375rem; 
            text-decoration: none; 
            color: #475569; 
            font-size: 0.875rem;
            font-weight: 500;
        }
        .nav-tab:hover { background: #e2e8f0; }
        .nav-tab.active { background: #1e293b; color: white; border-color: #1e293b; }
        
        .main-container { display: grid; grid-template-columns: 350px 1fr; min-height: calc(100vh - 60px); }
        
        .sidebar { 
            background: white; 
            border-right: 1px solid #e2e8f0; 
            padding: 1.5rem; 
            overflow-y: auto;
        }
        
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-weight: 500; font-size: 0.8rem; color: #374151; margin-bottom: 0.4rem; }
        input, textarea { 
            width: 100%; 
            padding: 0.6rem; 
            font-size: 0.85rem; 
            font-family: inherit; 
            border: 1px solid #d1d5db; 
            border-radius: 0.375rem; 
        }
        input:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
        textarea { resize: vertical; min-height: 80px; }
        
        .btn { 
            padding: 0.6rem 1rem; 
            font-size: 0.85rem; 
            font-weight: 600; 
            border: none; 
            border-radius: 0.375rem; 
            cursor: pointer; 
            transition: all 0.2s; 
        }
        .btn-primary { background: #1e293b; color: white; }
        .btn-primary:hover { background: #334155; }
        .btn-secondary { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-success { background: #059669; color: white; }
        .btn-success:hover { background: #047857; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #b91c1c; }
        
        .canvas-container { 
            padding: 1.5rem; 
            display: flex; 
            flex-direction: column;
            gap: 1rem;
        }
        
        .toolbar { 
            display: flex; 
            gap: 0.5rem; 
            align-items: center;
            flex-wrap: wrap;
        }
        
        .screenshot-wrapper { 
            position: relative; 
            border: 2px solid #e2e8f0; 
            border-radius: 0.5rem; 
            overflow: hidden;
            background: #f1f5f9;
            min-height: 500px;
        }
        
        .screenshot-img { 
            display: block; 
            max-width: 100%; 
            height: auto;
        }
        
        .canvas-overlay { 
            position: absolute; 
            top: 0; 
            left: 0; 
            cursor: crosshair;
        }
        
        .empty-state { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100%; 
            min-height: 400px;
            color: #64748b; 
            text-align: center;
        }
        .empty-state h3 { font-size: 1.125rem; margin-bottom: 0.5rem; color: #475569; }
        
        .boxes-list { margin-top: 1.5rem; }
        .boxes-list h3 { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.75rem; }
        
        .box-item { 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            border-radius: 0.375rem; 
            padding: 0.75rem; 
            margin-bottom: 0.75rem;
        }
        .box-item-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 0.5rem;
        }
        .box-item-title { font-size: 0.8rem; font-weight: 600; color: #374151; }
        .box-item-delete { 
            background: none; 
            border: none; 
            color: #dc2626; 
            cursor: pointer; 
            font-size: 0.75rem;
        }
        .box-item textarea { min-height: 60px; font-size: 0.8rem; }
        
        .generated-content { 
            margin-top: 0.5rem; 
            padding: 0.75rem; 
            background: #f0fdf4; 
            border: 1px solid #bbf7d0; 
            border-radius: 0.375rem;
            font-size: 0.8rem;
            line-height: 1.6;
        }
        .generated-content-header {
            font-weight: 600;
            color: #166534;
            margin-bottom: 0.25rem;
            font-size: 0.75rem;
        }
        
        .loading { 
            opacity: 0.6; 
            pointer-events: none; 
        }
        
        .status-bar {
            font-size: 0.75rem;
            color: #64748b;
            padding: 0.5rem 0;
        }
        
        .box-colors {
            --box-1: #3b82f6;
            --box-2: #10b981;
            --box-3: #f59e0b;
            --box-4: #ef4444;
            --box-5: #8b5cf6;
            --box-6: #ec4899;
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>SEO Content Generator</h1>
        <div class="nav-tabs">
            <a href="/" class="nav-tab">Content Generator</a>
            <a href="/scan" class="nav-tab active">Scan Mode</a>
        </div>
    </div>
    
    <div class="main-container">
        <div class="sidebar">
            <div class="form-group">
                <label for="scan-url">Website URL</label>
                <input type="text" id="scan-url" placeholder="https://example.com" value="{{ url or '' }}">
            </div>
            <button type="button" class="btn btn-primary" id="load-btn" style="width: 100%; margin-bottom: 1rem;">Load Website Screenshot</button>
            
            <hr style="border: none; border-top: 1px solid #e2e8f0; margin: 1rem 0;">
            
            <div class="form-group">
                <label for="scan-keywords">Keywords</label>
                <textarea id="scan-keywords" placeholder="Enter keywords separated by commas...">{{ keywords or '' }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="scan-icp">ICP (Ideal Customer Profile)</label>
                <textarea id="scan-icp" style="min-height: 100px;">{{ icp or '' }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="scan-uvp">UVP (Unique Value Proposition)</label>
                <textarea id="scan-uvp" style="min-height: 100px;">{{ uvp or '' }}</textarea>
            </div>
            
            <div class="boxes-list" id="boxes-list">
                <h3>Selected Areas</h3>
                <p style="font-size: 0.75rem; color: #64748b; margin-bottom: 0.75rem;">Draw boxes on the screenshot, then describe what content you want for each area.</p>
                <div id="box-items"></div>
            </div>
            
            <button type="button" class="btn btn-success" id="generate-all-btn" style="width: 100%; margin-top: 1rem;" disabled>Generate Content for All Areas</button>
        </div>
        
        <div class="canvas-container">
            <div class="toolbar">
                <button type="button" class="btn btn-secondary" id="clear-boxes-btn">Clear All Boxes</button>
                <span class="status-bar" id="status-bar">Draw rectangles on the screenshot to select areas for content</span>
            </div>
            
            <div class="screenshot-wrapper" id="screenshot-wrapper">
                <div class="empty-state" id="empty-state">
                    <h3>No Website Loaded</h3>
                    <p>Enter a URL and click "Load Website Screenshot" to begin</p>
                </div>
                <img src="" alt="Website screenshot" class="screenshot-img" id="screenshot-img" style="display: none;">
                <canvas id="canvas-overlay" class="canvas-overlay" style="display: none;"></canvas>
            </div>
        </div>
    </div>
    
    <script>
        const BOX_COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899'];
        let boxes = [];
        let isDrawing = false;
        let startX, startY;
        let canvas, ctx;
        let screenshotLoaded = false;
        
        document.addEventListener('DOMContentLoaded', function() {
            canvas = document.getElementById('canvas-overlay');
            ctx = canvas.getContext('2d');
            
            document.getElementById('load-btn').addEventListener('click', loadScreenshot);
            document.getElementById('clear-boxes-btn').addEventListener('click', clearAllBoxes);
            document.getElementById('generate-all-btn').addEventListener('click', generateAllContent);
            
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', endDrawing);
            canvas.addEventListener('mouseleave', endDrawing);
        });
        
        function loadScreenshot() {
            let url = document.getElementById('scan-url').value.trim();
            if (!url) {
                alert('Please enter a URL');
                return;
            }
            
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
                document.getElementById('scan-url').value = url;
            }
            
            try {
                new URL(url);
            } catch (e) {
                alert('Please enter a valid URL (e.g., https://example.com)');
                return;
            }
            
            const loadBtn = document.getElementById('load-btn');
            loadBtn.textContent = 'Loading...';
            loadBtn.disabled = true;
            
            const encodedUrl = encodeURIComponent(url);
            const screenshotUrl = `https://image.thum.io/get/width/1200/crop/900/${url}`;
            const img = document.getElementById('screenshot-img');
            
            img.onload = function() {
                document.getElementById('empty-state').style.display = 'none';
                img.style.display = 'block';
                canvas.style.display = 'block';
                
                canvas.width = img.offsetWidth;
                canvas.height = img.offsetHeight;
                
                screenshotLoaded = true;
                loadBtn.textContent = 'Load Website Screenshot';
                loadBtn.disabled = false;
                
                clearAllBoxes();
                updateStatus('Screenshot loaded. Draw rectangles to select content areas.');
            };
            
            img.onerror = function() {
                alert('Failed to load screenshot. Please check the URL and try again.');
                loadBtn.textContent = 'Load Website Screenshot';
                loadBtn.disabled = false;
            };
            
            img.src = screenshotUrl;
        }
        
        function startDrawing(e) {
            if (!screenshotLoaded) return;
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            startX = e.clientX - rect.left;
            startY = e.clientY - rect.top;
        }
        
        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const currentX = e.clientX - rect.left;
            const currentY = e.clientY - rect.top;
            
            redrawCanvas();
            
            ctx.strokeStyle = BOX_COLORS[boxes.length % BOX_COLORS.length];
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(startX, startY, currentX - startX, currentY - startY);
            ctx.setLineDash([]);
        }
        
        function endDrawing(e) {
            if (!isDrawing) return;
            isDrawing = false;
            
            const rect = canvas.getBoundingClientRect();
            const endX = e.clientX - rect.left;
            const endY = e.clientY - rect.top;
            
            const width = Math.abs(endX - startX);
            const height = Math.abs(endY - startY);
            
            if (width < 20 || height < 20) {
                redrawCanvas();
                return;
            }
            
            const box = {
                id: Date.now(),
                x: Math.min(startX, endX),
                y: Math.min(startY, endY),
                width: width,
                height: height,
                color: BOX_COLORS[boxes.length % BOX_COLORS.length],
                description: '',
                generatedContent: ''
            };
            
            boxes.push(box);
            redrawCanvas();
            renderBoxList();
            updateGenerateButton();
            updateStatus(`Box ${boxes.length} added. Add a description in the sidebar.`);
        }
        
        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            boxes.forEach((box, index) => {
                ctx.strokeStyle = box.color;
                ctx.lineWidth = 3;
                ctx.strokeRect(box.x, box.y, box.width, box.height);
                
                ctx.fillStyle = box.color;
                ctx.font = 'bold 14px Inter, sans-serif';
                ctx.fillText(`${index + 1}`, box.x + 5, box.y + 18);
                
                ctx.fillStyle = box.color + '20';
                ctx.fillRect(box.x, box.y, box.width, box.height);
            });
        }
        
        function renderBoxList() {
            const container = document.getElementById('box-items');
            container.innerHTML = boxes.map((box, index) => `
                <div class="box-item" style="border-left: 4px solid ${box.color};">
                    <div class="box-item-header">
                        <span class="box-item-title">Area ${index + 1}</span>
                        <button class="box-item-delete" onclick="deleteBox(${box.id})">Delete</button>
                    </div>
                    <textarea 
                        id="desc-${box.id}" 
                        placeholder="Describe what content should go here (e.g., 'Hero headline about our legal services', 'CTA button text', 'About section paragraph')..."
                        onchange="updateBoxDescription(${box.id}, this.value)"
                    >${box.description}</textarea>
                    ${box.generatedContent ? `
                        <div class="generated-content">
                            <div class="generated-content-header">Generated Content:</div>
                            ${box.generatedContent}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }
        
        function updateBoxDescription(id, description) {
            const box = boxes.find(b => b.id === id);
            if (box) {
                box.description = description;
            }
            updateGenerateButton();
        }
        
        function deleteBox(id) {
            boxes = boxes.filter(b => b.id !== id);
            redrawCanvas();
            renderBoxList();
            updateGenerateButton();
        }
        
        function clearAllBoxes() {
            boxes = [];
            if (ctx) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
            renderBoxList();
            updateGenerateButton();
            updateStatus('All boxes cleared.');
        }
        
        function updateGenerateButton() {
            const btn = document.getElementById('generate-all-btn');
            const hasDescriptions = boxes.some(b => b.description.trim());
            btn.disabled = boxes.length === 0 || !hasDescriptions;
        }
        
        function updateStatus(message) {
            document.getElementById('status-bar').textContent = message;
        }
        
        async function generateAllContent() {
            const icp = document.getElementById('scan-icp').value.trim();
            const uvp = document.getElementById('scan-uvp').value.trim();
            const keywords = document.getElementById('scan-keywords').value.trim();
            
            if (!icp || !uvp) {
                alert('Please fill in both ICP and UVP fields');
                return;
            }
            
            const boxesWithDesc = boxes.filter(b => b.description.trim());
            if (boxesWithDesc.length === 0) {
                alert('Please add descriptions to at least one box');
                return;
            }
            
            const generateBtn = document.getElementById('generate-all-btn');
            generateBtn.textContent = 'Generating...';
            generateBtn.disabled = true;
            updateStatus('Generating content for all areas...');
            
            try {
                const response = await fetch('/scan/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        icp: icp,
                        uvp: uvp,
                        keywords: keywords,
                        areas: boxesWithDesc.map((box, index) => ({
                            id: box.id,
                            areaNumber: index + 1,
                            description: box.description
                        }))
                    })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    alert('Error: ' + data.error);
                } else {
                    data.results.forEach(result => {
                        const box = boxes.find(b => b.id === result.id);
                        if (box) {
                            box.generatedContent = result.content;
                        }
                    });
                    renderBoxList();
                    updateStatus('Content generated for all areas!');
                }
            } catch (err) {
                alert('Error generating content: ' + err.message);
            } finally {
                generateBtn.textContent = 'Generate Content for All Areas';
                generateBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
